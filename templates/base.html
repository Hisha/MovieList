<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MovieList{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ root }}/static/css/style.css" rel="stylesheet">
</head>
<body data-root="{{ root }}">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container">
    <a class="navbar-brand" href="{{ root }}/">🎬 MovieList</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
            aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link{% if active == 'home' %} active{% endif %}" href="{{ root }}/">Home</a></li>
        <li class="nav-item"><a class="nav-link{% if active in ('movies', 'movie') %} active{% endif %}" href="{{ root }}/movies">Movies</a></li>
        <li class="nav-item"><a class="nav-link{% if active in ('shows', 'show') %} active{% endif %}" href="{{ root }}/shows">TV Shows</a></li>
      </ul>
      <form class="d-flex" role="search" action="{{ root }}/search" method="get">
        <input class="form-control me-2" type="search" name="q" placeholder="Search movies &amp; shows"
               aria-label="Search" value="{{ request.query_params.get('q', '') }}">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <ul class="navbar-nav ms-3 small">
        <li class="nav-item"><a class="nav-link" href="https://koegraphics.ddns.net/flux/">Flux Box</a></li>
        <li class="nav-item"><a class="nav-link" href="https://koegraphics.ddns.net/">N8N</a></li>
        <li class="nav-item"><a class="nav-link" href="https://koegraphics.ddns.net/chat/">Llamalith Chat</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
{% block content %}{% endblock %}
</main>

<footer class="border-top border-secondary py-3 mt-4">
  <div class="container small text-secondary">
    MovieList {{ version }} — read-only catalog of the Kodi media library.
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ root }}/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
